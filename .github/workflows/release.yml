name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Verify npm version for trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          # Require npm >= 11.5.1 for trusted publishing support
          if ! npm --version | awk -F. '{exit !($1 > 11 || ($1 == 11 && $2 > 5) || ($1 == 11 && $2 == 5 && $3 >= 1))}'; then
            echo "Error: npm >= 11.5.1 required for trusted publishing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Extract tag version
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG"

      - name: Verify version consistency
        run: |
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")

          echo "Tag version: $TAG_VERSION"
          echo "package.json version: $PACKAGE_VERSION"
          echo "server.json version: $SERVER_VERSION"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json ($PACKAGE_VERSION)"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$SERVER_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match server.json ($SERVER_VERSION)"
            exit 1
          fi

          echo "✓ Version consistency verified: $TAG_VERSION"

      - name: Publish to npm (trusted publishing)
        run: npm publish --access public --provenance

      - name: Wait for package availability
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          MAX_ATTEMPTS=30
          ATTEMPT=0

          echo "Waiting for @xtrinel/vaast-mcp@$VERSION to be available on npm..."

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if npm view "@xtrinel/vaast-mcp@$VERSION" version 2>/dev/null; then
              echo "✓ Package is available on npm"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Package not yet available, waiting 10s..."
            sleep 10
          done

          echo "Error: Package not available after ${MAX_ATTEMPTS}0s"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/mcp-publisher/releases/download/v1.8.1/mcp-publisher_Linux_x86_64.tar.gz | tar xz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Login to MCP Registry (DNS)
        run: |
          ./mcp-publisher login dns --domain xtrinel.com --private-key "$MCP_DNS_PRIVATE_KEY"
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
