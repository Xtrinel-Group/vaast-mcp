name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package.json and server.json versions match
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")

          echo "package.json version: $PACKAGE_VERSION"
          echo "server.json version: $SERVER_VERSION"

          if [ "$PACKAGE_VERSION" != "$SERVER_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match server.json ($SERVER_VERSION)"
            exit 1
          fi

          echo "✓ Version consistency verified: $PACKAGE_VERSION"
